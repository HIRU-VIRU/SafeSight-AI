##############################################################################
# SafeSight AI – Render Blueprint
# https://render.com/docs/blueprint-spec
#
# Deployment Architecture (512 MB free tier)
# ────────────────────────────────────────────────────────────────────────────
#
#   Vercel (CDN)  ───────────────────────── React SPA
#        ↓  VITE_API_BASE_URL
#   Render (this) ──────────────────────── Flask API + SQLite
#        ↓  HF_INFERENCE_URL
#   HuggingFace Space  ────────────────── YOLO26m inference
#
# This design keeps Render ≤ 512 MB (no torch / ultralytics installed).
# Tracker, violation logic, DB, and alerts all run on Render.
# Only YOLO is offloaded to HF Space (free CPU Space, 16 GB RAM).
#
# Prerequisites
# ─────────────
#  1. Deploy hf_space/ to a HuggingFace Space (SDK: docker).
#  2. Upload best.pt to that Space.
#  3. Push this repo to GitHub / GitLab.
#  4. On Render → New → Blueprint, connect your repo.
#  5. Set HF_INFERENCE_URL and FLASK_SECRET_KEY in the Render dashboard.
#
# Persistent Disk
# ───────────────
#  Mount path : /data
#  DATABASE_PATH       → /data/safesight.db
#  STORAGE_PATH        → /data/storage/violations
#  DEMO_STORAGE_PATH   → /data/storage/demo
#  LOG_PATH            → /data/logs
##############################################################################

services:
  - type: web
    name: safesight-ai
    runtime: python
    region: oregon          # pick your nearest: oregon | frankfurt | singapore | ohio

    # ── Build ────────────────────────────────────────────────────────────────
    buildCommand: ./build.sh

    # ── Start ────────────────────────────────────────────────────────────────
    # Gunicorn: 1 worker with 4 threads is fine for Render's starter tier.
    # Increase workers on higher plans.
    startCommand: >-
      gunicorn "api.dashboard_api:create_app()"
      --bind "0.0.0.0:$PORT"
      --workers 1
      --worker-class gthread
      --threads 4
      --timeout 300
      --keep-alive 5
      --access-logfile -
      --error-logfile -

    # ── Persistent Disk (Render Starter plan, ~$7/mo) ─────────────────────
    # Comment out if you're on the free tier (data resets on redeploy).
    disk:
      name: safesight-data
      mountPath: /data
      sizeGB: 10

    # ── Environment Variables ─────────────────────────────────────────────
    envVars:
      # Runtime paths – point everything at the persistent disk
      - key: DATABASE_PATH
        value: /data/safesight.db

      - key: STORAGE_PATH
        value: /data/storage/violations

      - key: DEMO_STORAGE_PATH
        value: /data/storage/demo

      - key: LOG_PATH
        value: /data/logs

      # Remote inference – offload YOLO to HuggingFace Space
      # Set these in Render dashboard after creating your HF Space.
      - key: USE_REMOTE_INFERENCE
        value: "true"

      - key: HF_INFERENCE_URL
        value: "https://hiruu-18-safesight-ai.hf.space"

      # YOLO tuning (forwarded to HF Space per request)
      - key: CONF_THRESHOLD
        value: "0.30"
      - key: IOU_THRESHOLD
        value: "0.30"
      - key: IMG_SIZE
        value: "512"

      # Flask
      - key: API_DEBUG
        value: "false"
      - key: FLASK_SECRET_KEY
        generateValue: true

    # ── Health check ─────────────────────────────────────────────────────
    healthCheckPath: /health
